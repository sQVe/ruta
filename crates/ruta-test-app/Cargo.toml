[package]
name = "ruta-test-app"
version = "0.0.0"
description = "A small X11 app that ruta's end-to-end tests open in a sandbox."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
accesskit = "0.25"
accesskit_unix = "0.24"
anyhow.workspace = true
serde_json.workspace = true
thiserror.workspace = true
x11rb = "0.14"

[dev-dependencies]
rustix = { version = "1", features = ["mount", "thread"] }
tempfile.workspace = true

# The test namespace guard is a shared source file outside this crate, so cargo-shear cannot see
# that the test target uses rustix.
[package.metadata.cargo-shear]
ignored = ["rustix"]

[lints]
workspace = true
