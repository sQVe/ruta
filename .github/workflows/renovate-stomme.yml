# This stomme sync call is pinned by the release commit of the version in mise.toml.
name: Sync stomme

on:
  push:
    branches: [renovate/stomme]

concurrency:
  # Runs are grouped by ref and commit, so a delayed event for another commit cannot cancel or
  # replace this commit's run.
  group: renovate-stomme-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    uses: sQVe/stomme/.github/workflows/sync-update.yml@9f180438089fc15639b32bec3325ae20bacb6fb2 # v0.2.8
    secrets:
      app-id: ${{ secrets.STOMME_APP_ID }}
      app-private-key: ${{ secrets.STOMME_APP_PRIVATE_KEY }}
