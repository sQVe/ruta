name: Sync stomme

on:
  push:
    branches: [renovate/stomme]

concurrency:
  # Runs are grouped by ref and commit, so a delayed event for another commit cannot cancel or
  # replace this commit's run.
  group: renovate-stomme-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    uses: sQVe/stomme/.github/workflows/sync-update.yml@9c3b27b3045ee81dc734087e3944b8e85ee95a27 # v0.2.4
    secrets:
      app-id: ${{ secrets.STOMME_APP_ID }}
      app-private-key: ${{ secrets.STOMME_APP_PRIVATE_KEY }}
