name: Sync stomme

on:
  push:
    branches: [renovate/stomme]

concurrency:
  # A newer run queues behind the running one, so a delayed older event cannot cancel it.
  group: renovate-stomme-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    uses: sQVe/stomme/.github/workflows/sync-update.yml@5a74df4fa839f0d98d5388a0211c3a5d9b9024fd # v0.2.0
    secrets:
      app-id: ${{ secrets.STOMME_APP_ID }}
      app-private-key: ${{ secrets.STOMME_APP_PRIVATE_KEY }}
