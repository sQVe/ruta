name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  # A newer run queues behind the running one, so a delayed older event cannot cancel it.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo xtask release-check "$GITHUB_REF_NAME"
